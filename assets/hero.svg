<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" fill="none">
<defs>
<pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#1a1a1a"/></pattern>
<linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0a0a" stop-opacity="0"/><stop offset="1" stop-color="#0a0a0a"/></linearGradient>
<filter id="glow" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

</defs>
<style>
.lab{font:500 10.5px 'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#737373;letter-spacing:1.6px}
.t{font:600 13.5px Inter,'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#ededed}
.s{font:400 10.5px 'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#737373}
.n{font:500 10px 'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#525252}
.log{font:400 11.5px 'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#a3a3a3}
.k{fill:#ededed}
.node{fill:#0f0f0f;stroke:#262626;stroke-width:1}
.wire{fill:none;stroke:#262626;stroke-width:1}
.dash{fill:none;stroke:#333;stroke-width:1;stroke-dasharray:3 4}
.live{animation:live 2.4s ease-in-out infinite}
@keyframes live{0%,100%{opacity:1}50%{opacity:.35}}

.big{font:600 44px Inter,'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#fafafa;letter-spacing:-1.2px}
.role{font:400 16px Inter,'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#a3a3a3}
.meta{font:400 11.5px 'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#737373}
.hl{font:500 12px Inter,'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#d4d4d4}
.cur{animation:cur 1s steps(1) infinite}@keyframes cur{50%{opacity:0}}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 3.6s ease-out infinite}
@keyframes ring{from{transform:scale(1);opacity:.5}to{transform:scale(2.6);opacity:0}}
.b0{stroke-dasharray:28 343;animation:b0 4.2s cubic-bezier(.45,0,.55,1) infinite;animation-delay:0.0s}@keyframes b0{0%{stroke-dashoffset:28}60%,100%{stroke-dashoffset:-143}}
.b1{stroke-dasharray:28 353;animation:b1 4.2s cubic-bezier(.45,0,.55,1) infinite;animation-delay:1.4s}@keyframes b1{0%{stroke-dashoffset:28}60%,100%{stroke-dashoffset:-153}}
.b2{stroke-dasharray:28 317;animation:b2 4.2s cubic-bezier(.45,0,.55,1) infinite;animation-delay:2.8s}@keyframes b2{0%{stroke-dashoffset:28}60%,100%{stroke-dashoffset:-117}}
</style>
<rect x=".5" y=".5" width="959" height="299" rx="10" fill="#0a0a0a" stroke="#1f1f1f"/>
<rect x="1" y="1" width="958" height="298" rx="10" fill="url(#grid)"/>
<text x="40" y="58" class="lab">INDEX <tspan fill="#404040">/</tspan> <tspan fill="#ededed">CHANDAN11232</tspan></text>
<text x="40" y="128" class="big">Chandan Garg</text>
<text x="40" y="160" class="role">Full-stack engineer building AI-native developer tools.</text>
<text x="40" y="214" class="meta">node.js · typescript · python · langgraph · graph databases</text>
<text x="40" y="240" class="meta"><tspan fill="#525252">$</tspan> currently shipping <tspan fill="#ededed">voice, graph and research agents</tspan><tspan class="cur" fill="#ededed"> ▍</tspan></text>
<line x1="520" y1="40" x2="520" y2="260" stroke="#1a1a1a"/>
<path d="M720,150 L600,72" class="wire"/><path d="M720,150 L600,72" stroke="#fafafa" stroke-width="1.5" stroke-linecap="round" class="b0" filter="url(#glow)"/><path d="M720,150 L868,110" class="wire"/><path d="M720,150 L868,110" stroke="#fafafa" stroke-width="1.5" stroke-linecap="round" class="b1" filter="url(#glow)"/><path d="M720,150 L640,236" class="wire"/><path d="M720,150 L640,236" stroke="#fafafa" stroke-width="1.5" stroke-linecap="round" class="b2" filter="url(#glow)"/><rect x="548" y="57" width="104" height="30" rx="15" fill="#0f0f0f" stroke="#262626"/><circle cx="562" cy="72" r="2.5" fill="#22c55e" class="live" style="animation-delay:0.0s"/><text x="572" y="76" class="hl">VoiceGraph</text><rect x="812" y="95" width="112" height="30" rx="15" fill="#0f0f0f" stroke="#262626"/><circle cx="826" cy="110" r="2.5" fill="#22c55e" class="live" style="animation-delay:0.6s"/><text x="836" y="114" class="hl">GraphSleuth</text><rect x="580" y="221" width="119" height="30" rx="15" fill="#0f0f0f" stroke="#262626"/><circle cx="594" cy="236" r="2.5" fill="#22c55e" class="live" style="animation-delay:1.2s"/><text x="604" y="240" class="hl">ResearchMind</text><circle cx="720" cy="150" r="10" fill="none" stroke="#525252" class="ring"/>
<circle cx="720" cy="150" r="10" fill="none" stroke="#525252" class="ring" style="animation-delay:1.8s"/>
