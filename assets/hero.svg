<svg xmlns="http://www.w3.org/2000/svg" width="960" height="230" viewBox="0 0 960 230">
  <defs>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#a371f7"/><stop offset=".5" stop-color="#39d0d8"/><stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
  </defs>
  <style>
    .mono{font:15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .p{fill:#3fb950}.c{fill:#e6edf3}.o{fill:#8b949e}.hl{fill:#a371f7}.cy{fill:#39d0d8}.pk{fill:#f778ba}
    .ln{opacity:0}
    .l1{animation:a1 12s infinite}.l2{animation:a2 12s infinite}.l3{animation:a3 12s infinite}
    .l4{animation:a4 12s infinite}.l5{animation:a5 12s infinite}.l6{animation:a6 12s infinite}
    @keyframes a1{0%,2%{opacity:0}4%,94%{opacity:1}100%{opacity:0}}
    @keyframes a2{0%,10%{opacity:0}12%,94%{opacity:1}100%{opacity:0}}
    @keyframes a3{0%,22%{opacity:0}24%,94%{opacity:1}100%{opacity:0}}
    @keyframes a4{0%,30%{opacity:0}32%,94%{opacity:1}100%{opacity:0}}
    @keyframes a5{0%,42%{opacity:0}44%,94%{opacity:1}100%{opacity:0}}
    @keyframes a6{0%,50%{opacity:0}52%,94%{opacity:1}100%{opacity:0}}
    .cur{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .sweep{animation:sweep 4s linear infinite}
    @keyframes sweep{from{transform:translateX(-300px)}to{transform:translateX(960px)}}
  </style>
  <rect width="960" height="230" rx="14" fill="#0d1117" stroke="#30363d"/>
  <rect width="960" height="34" rx="14" fill="#161b22"/>
  <rect y="20" width="960" height="14" fill="#161b22"/>
  <circle cx="22" cy="17" r="6" fill="#ff5f56"/><circle cx="42" cy="17" r="6" fill="#ffbd2e"/><circle cx="62" cy="17" r="6" fill="#27c93f"/>
  <text x="480" y="22" text-anchor="middle" class="mono o" font-size="12">chandan@dev: ~</text>
  <rect class="sweep" y="33" width="300" height="2" fill="url(#bar)"/>

  <g class="mono">
    <text x="28" y="70" class="ln l1"><tspan class="p">➜</tspan><tspan class="cy"> ~ </tspan><tspan class="c">whoami</tspan></text>
    <text x="28" y="94" class="ln l2"><tspan class="hl" font-weight="700">Chandan Garg</tspan><tspan class="o"> — Full Stack Web Developer · Node.js enthusiast · building AI-native tools</tspan></text>
    <text x="28" y="126" class="ln l3"><tspan class="p">➜</tspan><tspan class="cy"> ~ </tspan><tspan class="c">ls ./projects --running</tspan></text>
    <text x="28" y="150" class="ln l4"><tspan class="pk">🎙 voicegraph/</tspan><tspan class="o">     </tspan><tspan class="cy">🕵 graphsleuth/</tspan><tspan class="o">     </tspan><tspan class="p">🧠 researchmind/</tspan></text>
    <text x="28" y="182" class="ln l5"><tspan class="p">➜</tspan><tspan class="cy"> ~ </tspan><tspan class="c">./ship --ideas-to-production</tspan></text>
    <text x="28" y="206" class="ln l6"><tspan class="o">[</tspan><tspan class="p">████████████████████</tspan><tspan class="o">] 100% · workflows live below ↓ </tspan><tspan class="c cur">▋</tspan></text>
  </g>
</svg>
