<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340">
  <defs>
    <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#f778ba"/><stop offset="1" stop-color="#a371f7"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <path id="main" d="M150,170 H700"/>
    <clipPath id="type"><rect x="30" y="285" height="34" width="0">
      <animate attributeName="width" values="0;520;520;0" keyTimes="0;.3;.92;1" dur="8s" repeatCount="indefinite"/>
    </rect></clipPath>
  </defs>
  <style>
    .t{font:600 14px 'Segoe UI',Ubuntu,Helvetica,sans-serif;fill:#e6edf3}
    .tm{font:600 12px 'Segoe UI',Ubuntu,Helvetica,sans-serif;fill:#e6edf3}
    .s{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8b949e}
    .h{font:700 13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#f778ba;letter-spacing:2px}
    .node{fill:#161b22;stroke:#30363d;stroke-width:1.5}
    .act{animation:act 8s infinite}
    .n2{animation-delay:.6s}.n3{animation-delay:1.2s}.n4{animation-delay:1.8s}
    @keyframes act{0%,12%{stroke:#f778ba;stroke-width:2.5}20%,100%{stroke:#30363d;stroke-width:1.5}}
    .edge{fill:none;stroke:#21262d;stroke-width:3}
    .flow{fill:none;stroke:url(#g);stroke-width:2;stroke-dasharray:6 10;animation:dash 1s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-32}}
    .bar{transform-box:fill-box;transform-origin:center;animation:wave .9s ease-in-out infinite}
    @keyframes wave{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
    .dot{animation:blink 1.2s infinite}@keyframes blink{50%{opacity:.2}}
    .newbox{opacity:0;animation:nb 8s infinite}
    @keyframes nb{0%,38%{opacity:0}45%,92%{opacity:1}100%{opacity:0}}
    .newbox rect{stroke:#f778ba;stroke-width:2}
    .warn{opacity:0;animation:warn 8s infinite}
    @keyframes warn{0%,55%{opacity:0}60%,92%{opacity:1}100%{opacity:0}}
    .ce{stroke:#484f58;stroke-width:1.5;fill:none}
  </style>
  <rect width="960" height="340" rx="14" fill="#0d1117" stroke="#30363d"/>
  <text x="30" y="40" class="h">VOICEGRAPH · SAY THE SYSTEM, SHAPE IT BY HAND</text>
  <rect x="808" y="24" width="122" height="24" rx="12" fill="#2a1a26" stroke="#f778ba"/>
  <circle class="dot" cx="824" cy="36" r="4" fill="#f778ba"/>
  <text x="836" y="40" class="s" style="fill:#f778ba">listening…</text>

  <use href="#main" class="edge"/><use href="#main" class="flow"/>

  <!-- voice -->
  <rect class="node act" x="30" y="135" width="120" height="70" rx="12"/>
  <text x="44" y="157" class="t">🎙 Wispr Flow</text>
  <g fill="url(#g)">
    <rect class="bar" x="44" y="172" width="5" height="20" rx="2"/>
    <rect class="bar" x="54" y="172" width="5" height="20" rx="2" style="animation-delay:.15s"/>
    <rect class="bar" x="64" y="172" width="5" height="20" rx="2" style="animation-delay:.3s"/>
    <rect class="bar" x="74" y="172" width="5" height="20" rx="2" style="animation-delay:.45s"/>
    <rect class="bar" x="84" y="172" width="5" height="20" rx="2" style="animation-delay:.6s"/>
    <rect class="bar" x="94" y="172" width="5" height="20" rx="2" style="animation-delay:.75s"/>
    <rect class="bar" x="104" y="172" width="5" height="20" rx="2" style="animation-delay:.3s"/>
    <rect class="bar" x="114" y="172" width="5" height="20" rx="2" style="animation-delay:.1s"/>
    <rect class="bar" x="124" y="172" width="5" height="20" rx="2" style="animation-delay:.5s"/>
  </g>

  <rect class="node act n2" x="190" y="140" width="140" height="60" rx="12"/>
  <text x="204" y="165" class="t">/api/command</text><text x="204" y="185" class="s">vercel serverless</text>

  <rect class="node act n3" x="370" y="140" width="150" height="60" rx="12"/>
  <text x="384" y="165" class="t">⚡ Groq LLM</text><text x="384" y="185" class="s">gpt-oss-120b · JSON</text>

  <rect class="node act n4" x="560" y="140" width="140" height="60" rx="12"/>
  <text x="574" y="165" class="t">Validate + ELK</text><text x="574" y="185" class="s">sanitize · layout</text>

  <!-- canvas -->
  <rect x="740" y="66" width="190" height="210" rx="12" fill="#0f0b14" stroke="#3b2a4a"/>
  <text x="752" y="84" class="s">react-flow canvas</text>
  <path class="ce" d="M835,113 V140"/>
  <path class="ce" d="M835,163 V232"/>
  <rect x="790" y="94" width="90" height="20" rx="5" class="node"/><text x="800" y="108" class="tm">Client</text>
  <rect x="790" y="140" width="90" height="22" rx="5" class="node"/><text x="800" y="155" class="tm">API</text>
  <g class="newbox">
    <path d="M835,163 V186" stroke="#f778ba" stroke-width="1.5" stroke-dasharray="3 3"/>
    <rect x="790" y="186" width="90" height="22" rx="5" fill="#2a1a26"/><text x="800" y="201" class="tm">Redis cache</text>
  </g>
  <rect x="790" y="232" width="90" height="22" rx="5" class="node"/><text x="800" y="247" class="tm">Postgres</text>
  <text x="752" y="268" class="s warn" style="fill:#d29922">⚠ single DB, no replica</text>

  <text x="740" y="298" class="s">export: PNG · SVG · Mermaid</text>

  <g filter="url(#glow)">
    <circle r="5" fill="#f778ba"><animateMotion dur="2.6s" repeatCount="indefinite"><mpath href="#main"/></animateMotion></circle>
    <circle r="4" fill="#a371f7"><animateMotion dur="2.6s" begin="1.3s" repeatCount="indefinite"><mpath href="#main"/></animateMotion></circle>
  </g>
  <path d="M700,170 H740" class="edge"/><path d="M700,170 H740" class="flow"/>

  <text x="30" y="262" class="s">voice command</text>
  <text x="30" y="306" class="s" style="font-size:14px;fill:#e6edf3" clip-path="url(#type)">“Add a Redis cache between the API and Postgres”</text>
</svg>
